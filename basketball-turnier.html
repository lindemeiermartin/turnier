<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sparkasse Göttingen-Basketball Grundschulliga – Turnierverwaltung</title>
<style>
:root{--o:#5f227b;--o2:#f3ecf7;--ink:#24182c;--mut:#6f6a75;--line:#e3e4e5;--bg:#f3f3f4;--card:#fff;--ok:#2b8a3e;--warn:#b35c00;--bad:#c92a2a;--ga:#5e6163;--gb:#5f227b;--ko:#5f227b;--silver:#b1b3b4;--deep:#2a1036}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select{font:inherit;color:inherit}
input[type=number]{width:4.5em}
.btn{display:inline-flex;align-items:center;gap:.35em;border:1px solid var(--line);background:#fff;border-radius:8px;padding:.45em .85em;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#c5cad3}
.btn.primary{background:var(--o);border-color:var(--o);color:#fff;font-weight:600}
.btn.primary:hover{background:#4a1a60}
.btn.sm{padding:.35em .6em}
.btn:disabled{opacity:.45;cursor:default}
.icon{border:0;background:none;cursor:pointer;color:var(--mut);padding:.2em .45em;border-radius:6px}
.icon:hover{background:#f1f3f5;color:var(--bad)}
.link{border:0;background:none;color:var(--o);cursor:pointer;padding:0;text-decoration:underline;font-size:.9em}
.hint{color:var(--mut);font-size:.88em;margin:.4em 0 0}
.warn{color:var(--warn);font-weight:600}
.bad{color:var(--bad);font-weight:600}
.pill{display:inline-block;font-size:.78em;font-weight:600;padding:.12em .55em;border-radius:99px;background:#eef1f5;color:#495057;white-space:nowrap}
.pill.grp-A{background:#e9eaeb;color:var(--ga)}.pill.grp-B{background:#efe5f4;color:var(--gb)}.pill.ko{background:#5f227b;color:#fff}

/* ---------- Admin ---------- */
header.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem 1.2rem;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.5rem;flex:1 1 560px;min-width:240px}
.ball{font-size:1.6rem}
.tname-in{font-size:1.25rem;font-weight:700;border:1px solid transparent;border-radius:8px;padding:.2em .4em;background:transparent;width:100%;max-width:520px}
.tname-in:hover,.tname-in:focus{border-color:var(--line);background:#fff;outline:none}
.actions{display:flex;gap:.5rem;flex-wrap:wrap}

.clockbar{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto;gap:1rem;padding:.8rem 1.2rem;background:linear-gradient(90deg,#2a1036,#3d1650);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15);border-bottom:3px solid var(--silver)}
.cb-empty{grid-column:1/-1;color:#aab;padding:.4rem 0}
.cb-round{font-weight:700;font-size:1.05rem}
.cb-plan{color:#aeb6c6;font-size:.88rem;margin-bottom:.35rem}
.cb-plan .late{color:#ffb4b4;font-weight:600}
.cb-games{border-collapse:collapse}
.cb-games td{padding:.2rem .35rem;border:0}
.cb-games .pill{background:#4a2a5c;color:#ece0f3}
.cb-games .pill.ko{background:#e3e4e5;color:#5f227b}
.cb-games .ph{color:#8f99ad}
.cb-games input.sc{background:#3a1d4a;border:1px solid #6a4a7d;color:#fff}
.cb-games .court{color:#aeb6c6;font-size:.88rem}
.cb-games label.chk{color:#cfd6e2!important}
.cb-games .tiepick button{color:#1c2230}
.cb-clock{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:330px}
.cb-time{font-size:3.4rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:.02em}
.cb-time.last{color:#e2c4f2}.cb-time.ended{color:#ff6b6b}.cb-time.co{color:#c9cbcc}
.cb-state{font-size:.85rem;color:#aeb6c6;margin:.2rem 0 .5rem;text-transform:uppercase;letter-spacing:.08em}
.cb-btns,.cb-adj{display:flex;gap:.35rem;flex-wrap:wrap;justify-content:center}
.cb-btns .btn{background:#3a1d4a;border-color:#6a4a7d;color:#fff}
.cb-btns .btn.go{background:var(--ok);border-color:var(--ok);font-weight:700;min-width:6.5em;justify-content:center}
.cb-btns .btn.go.pause{background:#b1b3b4;border-color:#b1b3b4;color:#2a1036}
.cb-adj{margin-top:.35rem}
.cb-adj button{border:1px solid #6a4a7d;background:transparent;color:#cfd6e2;border-radius:6px;padding:.15em .5em;cursor:pointer;font-size:.85rem}
.cb-music{margin-top:.45rem;font-size:.82rem;color:#aeb6c6;display:flex;gap:.5rem;align-items:center}
.cb-music button{border:1px solid #6a4a7d;background:transparent;color:#cfd6e2;border-radius:6px;padding:.1em .5em;cursor:pointer}
.cb-music .on{color:#69db7c;font-weight:600}

nav.tabs{display:flex;gap:.25rem;padding:.6rem 1.2rem 0;background:var(--bg);flex-wrap:wrap}
nav.tabs button{border:1px solid transparent;border-bottom:none;background:none;padding:.55em 1em;border-radius:8px 8px 0 0;cursor:pointer;color:var(--mut);font-weight:600}
nav.tabs button.on{background:#fff;border-color:var(--line);color:var(--ink)}
main{padding:0 1.2rem 15rem}
.tab{display:none;background:#fff;border:1px solid var(--line);border-radius:0 10px 10px 10px;padding:1.1rem}
.tab.on{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:1rem}
.card{border:1px solid var(--line);border-radius:10px;padding:1rem;background:#fff}
.card h2{font-size:1.05rem;margin:0 0 .7rem}
.card h3{font-size:.95rem;margin:1rem 0 .4rem}
.team-row{display:flex;align-items:center;gap:.4rem;margin-bottom:.3rem}
.team-row .num{width:1.6em;text-align:right;color:var(--mut);font-size:.85em}
.team-row input{flex:1;border:1px solid var(--line);border-radius:7px;padding:.35em .55em}
select.grp{border:1px solid var(--line);border-radius:7px;padding:.3em .4em;font-weight:700}
select.grp-A{color:var(--ga)}select.grp-B{color:var(--gb)}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem;align-items:center}
.mode{display:block;border:1px solid var(--line);border-radius:9px;padding:.6rem .7rem .6rem 2.1rem;margin-bottom:.5rem;cursor:pointer;position:relative}
.mode input{position:absolute;left:.7rem;top:.8rem}
.mode b{display:block}
.mode span{display:block;color:var(--mut);font-size:.88em}
.mode em{display:block;font-style:normal;font-size:.84em;color:var(--o);font-weight:600;margin-top:.15rem}
.mode.on{border-color:var(--o);background:var(--o2)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:.6rem .9rem}
.fields label{display:flex;flex-direction:column;font-size:.88em;color:var(--mut);gap:.2rem}
.fields input,.fields select{border:1px solid var(--line);border-radius:7px;padding:.35em .5em;color:var(--ink);width:100%}
.fields input:disabled{background:#f4f5f8}
.fields .full{grid-column:1/-1}
label.chk{display:flex!important;flex-direction:row!important;align-items:center;gap:.45rem;color:var(--ink)!important;font-size:.92em}
label.chk input{width:auto}
.summary ul{margin:.2rem 0 .8rem;padding-left:1.1rem}
.summary li{margin:.15rem 0}
.banner{background:#f3ecf7;border:1px solid #d6bfe3;color:#5f227b;border-radius:8px;padding:.6rem .8rem;margin-bottom:.8rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}

table.plan{width:100%;border-collapse:collapse}
table.plan td{padding:.35rem .45rem;border-bottom:1px solid #f0f1f4;vertical-align:middle}
table.plan tr.sh td{background:#f7f8fa;border-top:2px solid var(--line);font-size:.92em}
table.plan tbody.cur tr.sh td{background:var(--o2);border-top-color:var(--o)}
table.plan tbody.cur tr.g td{background:#faf6fc}
table.plan tbody.past tr.g td{opacity:.8}
table.plan tr.brk td{text-align:center;color:var(--mut);background:#fbfbfc;font-size:.9em;padding:.5rem}
.nowtag{background:var(--o);color:#fff;border-radius:99px;font-size:.78em;padding:.1em .55em;font-weight:700;margin-left:.4em}
td.home{text-align:right;font-weight:600}
td.away{font-weight:600}
td.ph{color:var(--mut);font-style:italic;font-weight:400}
td.win{color:var(--ok)}
td.score{white-space:nowrap;text-align:center}
input.sc{width:3.4em;text-align:center;border:1px solid var(--line);border-radius:6px;padding:.25em .2em;font-weight:700;font-variant-numeric:tabular-nums}
td.score span{margin:0 .25em;font-weight:700}
tr.fin input.sc{background:#ebfbee;border-color:#b2f2bb}
td.court{color:var(--mut);font-size:.88em;white-space:nowrap}
.tiepick{font-size:.82em;margin-top:.2rem}
.tiepick button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:.05em .4em;margin-left:.2em;cursor:pointer;font-size:.95em}
.tiepick button.on{background:var(--ok);color:#fff;border-color:var(--ok)}

table.tbl{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.tbl th,table.tbl td{padding:.3rem .45rem;text-align:center;border-bottom:1px solid #f0f1f4}
table.tbl th{font-size:.8em;color:var(--mut);font-weight:600}
table.tbl .l{text-align:left}
table.tbl .b{font-weight:800}
.kolist{list-style:none;padding:0;margin:0}
.kolist li{display:flex;gap:.6rem;align-items:center;padding:.3rem 0;border-bottom:1px solid #f0f1f4}
.kolist .lab{width:10em;color:var(--mut);font-size:.88em}
.rank{list-style:none;padding:0;margin:0;counter-reset:r}
.rank li{padding:.3rem .2rem;border-bottom:1px solid #f0f1f4;display:flex;gap:.6rem}
.rank b{width:2.2em;text-align:right}

.spdock{position:fixed;right:12px;bottom:12px;width:380px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.15);z-index:30;overflow:hidden}
.spdock-h{display:flex;justify-content:space-between;font-size:.8rem;padding:.35rem .6rem;color:var(--mut);background:#f7f8fa}
.spdock.hidden{display:none}
.spdock-h{cursor:pointer}
.spdock.min #spHost{height:0;overflow:hidden}
#spHost iframe{display:block;border:0}
#spHost .sp-empty{padding:.7rem;color:var(--mut);font-size:.88em}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2a1036;color:#fff;padding:.6rem 1rem;border-radius:9px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:40;max-width:90vw}
#toast.on{opacity:1}
#print{display:none}

@media (max-width:900px){.clockbar{grid-template-columns:1fr}.cb-clock{min-width:0}.fields{grid-template-columns:1fr}}

@media print{
  body{background:#fff}
  #app>*:not(#print){display:none!important}
  #print{display:block!important;font-size:11pt}
  #print h1{font-size:18pt;margin:0 0 4pt}
  #print table{width:100%;border-collapse:collapse;margin-top:8pt}
  #print th,#print td{border:1px solid #999;padding:5pt 6pt;vertical-align:top}
  #print th{background:#eee}
  #print td small{display:block;color:#555;font-size:8.5pt}
  #print .line{display:block;margin-top:3pt;color:#555}
  #print tr.brk td{text-align:center;background:#f5f5f5;font-style:italic}
  #print .groups{display:flex;gap:24pt;margin-top:6pt}
  #print .tsheet{page-break-after:always;break-after:page}
  #print .tsheet:last-child{page-break-after:auto;break-after:auto}
  #print .tsheet h1{font-size:24pt;color:#5f227b;margin:6pt 0 2pt}
  #print .tsheet h2{font-size:13pt;margin:16pt 0 2pt;color:#5f227b}
  #print .tsheet .sub{font-size:11pt;color:#444}
  #print .tsheet td.res{width:90pt;text-align:center;color:#555}
  #print .tsheet .note{font-size:9.5pt;color:#555;margin-top:4pt}
  #print .tsheet .bar{height:4pt;background:#5f227b;margin:6pt 0 0}
  #print .tsheet .plogos{display:flex;justify-content:space-between;align-items:center}
}

/* ---------- Zuschauer-Anzeige ---------- */
body.display{background:radial-gradient(ellipse at top,#3a1550 0%,#1d0a29 55%,#14071d 100%);color:#f4f0f7;overflow:hidden;height:100vh}
.disp{height:100vh;display:flex;flex-direction:column;padding:2.2vh 2.4vw;gap:2vh}
.d-head{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2vw}
.d-title{font-size:4.6vh;font-weight:800;letter-spacing:.01em}
.d-round{font-size:2.5vh;color:#c3b7cc;margin-top:.4vh}
.d-clockbox{text-align:center;background:#2a1238;border:1px solid #4b2a5e;border-radius:2vh;padding:1vh 3vw 1.2vh;min-width:26vw}
.d-time{font-size:13vh;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.d-time.last{color:#e2c4f2;animation:pulse 1s ease-in-out infinite}
.d-time.ended{color:#ff6b6b}
.d-time.co{color:#d4d6d7}
@keyframes pulse{50%{opacity:.6}}
.d-state{font-size:2.2vh;text-transform:uppercase;letter-spacing:.15em;color:#c3b7cc;margin-top:.5vh}
.d-main{flex:1;overflow:hidden;display:grid;grid-template-columns:1.15fr 1fr;gap:2.4vw;min-height:0}
.d-col{display:flex;flex-direction:column;gap:2vh;min-height:0;overflow:hidden}
.d-sec h3{margin:0 0 1vh;font-size:2.3vh;text-transform:uppercase;letter-spacing:.14em;color:#c9cbcc}
.d-sec h3 small{color:#c3b7cc;letter-spacing:.05em;text-transform:none;font-weight:500;margin-left:.6em}
.dc{background:#2a1238;border:1px solid #4b2a5e;border-radius:1.6vh;padding:1.2vh 1.4vw;margin-bottom:1.2vh}
.dc.now{border-color:#b1b3b4;background:linear-gradient(180deg,#3a1a4d,#2a1238)}
.dc-h{display:flex;justify-content:space-between;align-items:center;font-size:2vh;color:#c3b7cc;margin-bottom:.5vh}
.dc-h .pill{font-size:1.8vh;background:#4b2a5e;color:#ece0f3}
.dc-h .pill.grp-A{background:#e3e4e5;color:#3b2a44}.dc-h .pill.grp-B{background:#5f227b;color:#ffffff}.dc-h .pill.ko{background:#ffffff;color:#5f227b}
.dc-m{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1vw;min-height:7.4vh}
.dt{font-size:3.2vh;font-weight:700;line-height:1.12;overflow-wrap:anywhere;hyphens:auto}
.dt.r{text-align:right}
.dt.ph{color:#9a8aa6;font-style:italic;font-weight:500}
.ds{font-size:4.4vh;font-weight:800;font-variant-numeric:tabular-nums;min-width:7vw;text-align:center}
.ds i{font-style:normal;color:#8a7896;margin:0 .3em;font-weight:500}
.dc.small{padding:.8vh 1.2vw;margin-bottom:.8vh}
.dc.small .dc-m{min-height:0}
.dc.small .dt{font-size:2.5vh}.dc.small .ds{font-size:3vh}
.d-res{list-style:none;margin:0;padding:0}
.d-res li{display:grid;grid-template-columns:1fr auto 1fr;gap:1vw;font-size:2.4vh;padding:.55vh 0;border-bottom:1px solid #3a2148}
.d-res li span:last-child{text-align:right}
.d-res b{font-variant-numeric:tabular-nums;text-align:center}
.d-res .w{color:#d9b8ee;font-weight:700}
.d-tbl{width:100%;border-collapse:collapse;font-size:2.35vh;font-variant-numeric:tabular-nums}
.d-tbl th{font-size:1.7vh;color:#9a8aa6;font-weight:600;text-align:center;padding:.4vh .4vw;text-transform:uppercase;letter-spacing:.06em}
.d-tbl td{text-align:center;padding:.55vh .4vw;border-top:1px solid #3a2148}
.d-tbl .l{text-align:left}
.d-tbl .b{font-weight:800;color:#ffffff}
.d-tbl tr.q td:first-child{color:#c9cbcc;font-weight:800}
.d-gh{display:flex;align-items:center;gap:.8vw}
.d-gh .dot{width:1.2vh;height:1.2vh;border-radius:50%}
.d-ko li{display:grid;grid-template-columns:13vw 1fr auto 1fr;gap:1vw;align-items:center;font-size:2.35vh;padding:.6vh 0;border-bottom:1px solid #3a2148}
.d-ko .lab{color:#c3b7cc;font-size:1.9vh}
.d-ko .ph{color:#9a8aa6;font-style:italic}
.d-ko b{font-variant-numeric:tabular-nums;text-align:center;min-width:5vw}
.d-ko .w{color:#d9b8ee;font-weight:700}
.d-ko span:nth-child(4){text-align:right}
.d-rank{list-style:none;margin:0;padding:0;columns:2;column-gap:3vw}
.d-rank li{font-size:3.6vh;padding:1vh 0;border-bottom:1px solid #3a2148;break-inside:avoid;display:flex;gap:1.2vw}
.d-rank b{width:3.2vw;text-align:right;color:#c9cbcc}
.d-rank li.m1 b,.d-rank li.m1{color:#ffd43b}.d-rank li.m2 b,.d-rank li.m2{color:#dee2e6}.d-rank li.m3 b,.d-rank li.m3{color:#e8a87c}
.d-empty{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh}
.d-empty h1{font-size:7vh;margin:0}.d-empty p{font-size:3vh;color:#c3b7cc}
.d-final{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:80vw;margin:0 auto;width:100%}
.d-final h2{font-size:5vh;text-align:center;color:#c9cbcc;margin:0 0 3vh;letter-spacing:.1em;text-transform:uppercase}
.fsbtn{position:fixed;right:1.2vw;top:1.2vh;background:#3a2148;color:#c3b7cc;border:1px solid #5a3a6d;border-radius:8px;padding:.5em .9em;cursor:pointer;opacity:.6}
.fsbtn:hover{opacity:1}
.d-brand{display:flex;align-items:center;gap:1.6vw}
.d-logos{display:flex;gap:1.2vw;align-items:center}
.d-logos img{height:14vh;max-width:22vw;object-fit:contain;background:#fff;border-radius:1.2vh;padding:1vh}
.d-foot{flex:none;display:flex;justify-content:center;align-items:center;gap:5vw;background:#fff;border-radius:1.4vh;padding:.9vh 2vw;border-top:.5vh solid #b1b3b4}
.d-foot img{height:7vh;max-width:20vw;object-fit:contain}
.a-logos{display:flex;gap:.4rem;align-items:center}
.a-logos img{height:34px;max-width:110px;object-fit:contain}
.logo-list{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.4rem}
.logo-item{position:relative;border:1px solid var(--line);border-radius:8px;padding:.4rem;background:#fff}
.logo-item img{height:60px;max-width:160px;object-fit:contain;display:block}
.logo-item button{position:absolute;top:-8px;right:-8px;background:#fff;border:1px solid var(--line);border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:12px;line-height:1}
#print .plogos img{height:50pt;max-width:160pt;object-fit:contain;margin-right:12pt}
.nosync{position:fixed;left:1.2vw;bottom:1.2vh;font-size:1.6vh;color:#8a7896}

/* ---------- Spielbericht (Verwaltung) ---------- */
.kgdot{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:#adb5bd;margin-right:.4em;vertical-align:middle}
.kgdot.ok{background:#40c057}.kgdot.warn{background:#fab005}.kgdot.bad{background:#fa5252}
.cb-kg{font-size:.82rem;color:#d9cbe3;margin-top:.3rem}
.kgp-list{display:flex;flex-direction:column;gap:.35rem;margin-top:.5rem}
.kgp{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;background:#fff;color:#24182c;border-radius:8px;padding:.4rem .6rem;border-left:5px solid #b1b3b4;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.kgp-tag{font-size:.78em;font-weight:700;color:#5f227b;text-transform:uppercase;letter-spacing:.04em}
.kgp button{border:1px solid #5f227b;background:#5f227b;color:#fff;border-radius:6px;padding:.2em .7em;cursor:pointer;font-weight:600}
.kgp button.no{background:#fff;color:#5f227b}
.kgqrs{display:flex;gap:1rem;flex-wrap:wrap}
.kgqr{text-align:center;flex:1;min-width:180px}
.kgqr h3{margin:.2rem 0 .4rem}
.kgqr svg{width:180px;height:180px}
.kgqr-empty{border:2px dashed var(--line);border-radius:8px;padding:2rem 1rem;color:var(--mut);font-size:.9em}
.kglink{font-size:.72em;color:var(--mut);word-break:break-all;margin:.3rem 0}
ol.steps{padding-left:1.2rem;margin:.2rem 0}ol.steps li{margin:.25rem 0}
code{background:#f3ecf7;padding:.05em .3em;border-radius:4px;font-size:.92em}
@media print{
  #print .kgbig{text-align:center;margin:18pt 0}
  #print .kgbig svg{width:300pt;height:300pt}
  #print .kgsteps{font-size:13pt;line-height:1.5}
}

/* ---------- Spielbericht (iPad) ---------- */
body.kgbody{background:radial-gradient(ellipse at top,#3a1550 0%,#1d0a29 60%,#14071d 100%);color:#f4f0f7;min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.kg{max-width:1200px;margin:0 auto;padding:2vh 2.5vw;display:flex;flex-direction:column;min-height:100vh;gap:1.6vh}
.kg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:2vw}
.kg-t{font-size:clamp(18px,2.6vh,30px);font-weight:800}
.kg-sub{font-size:clamp(16px,2.3vh,26px);color:#d9cbe3;margin-top:.3vh}
.kg-sub b{color:#fff}
.kg-conn{font-size:clamp(13px,1.7vh,18px);color:#c3b7cc;margin-top:.5vh}
.kg-cbox{text-align:center;background:#2a1238;border:1px solid #4b2a5e;border-radius:14px;padding:.6vh 2vw}
.kg-clock{font-size:clamp(36px,7vh,80px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.kg-clock.last{color:#e2c4f2}.kg-clock.ended{color:#ff6b6b}.kg-clock.co{color:#d4d6d7}
.kg-clab{font-size:clamp(11px,1.5vh,16px);text-transform:uppercase;letter-spacing:.12em;color:#c3b7cc}
.kg-main{flex:1;display:flex;flex-direction:column;gap:1.8vh;position:relative}
.kg-label{text-align:center;font-size:clamp(15px,2.2vh,24px);color:#d9cbe3}
.kg-teams{display:grid;grid-template-columns:1fr auto 1fr;gap:2vw;align-items:stretch;flex:1}
.kg-vs{align-self:center;font-size:clamp(40px,8vh,90px);font-weight:800;color:#8a7896}
.kg-team{background:#2a1238;border:2px solid #4b2a5e;border-radius:20px;padding:2vh 1.6vw;display:flex;flex-direction:column;align-items:center;gap:1.4vh}
.kg-team.lock{opacity:.75}
.kg-name{font-size:clamp(20px,3.4vh,38px);font-weight:800;text-align:center;line-height:1.15;min-height:2.3em;display:flex;align-items:center;overflow-wrap:anywhere}
.kg-score{font-size:clamp(70px,16vh,180px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.kg-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:1vw;width:100%}
.kg-btns button{font-size:clamp(26px,5vh,54px);font-weight:800;padding:2.2vh 0;border-radius:16px;border:0;background:#fff;color:#5f227b;cursor:pointer}
.kg-btns button:active{background:#e3d2ee}
.kg-minus{font-size:clamp(16px,2.4vh,26px);font-weight:700;padding:1vh 2.5vw;border-radius:12px;border:1px solid #8a7896;background:transparent;color:#d9cbe3;cursor:pointer}
.kg button:disabled{opacity:.4;cursor:default}
.kg-foot{display:flex;gap:2vw;justify-content:space-between}
.kg-undo{font-size:clamp(16px,2.4vh,26px);padding:1.8vh 2.5vw;border-radius:14px;border:1px solid #b1b3b4;background:transparent;color:#fff;cursor:pointer}
.kg-end{flex:1;font-size:clamp(18px,2.8vh,30px);font-weight:800;padding:1.8vh 2.5vw;border-radius:14px;border:0;background:#b1b3b4;color:#2a1036;cursor:pointer}
.kg-status{text-align:center;font-size:clamp(15px,2.2vh,24px);padding:1.2vh 1vw;border-radius:12px}
.kg-status.wait{background:#4b2a5e}.kg-status.ok{background:#1f5130}.kg-status.bad{background:#6b1f1f}
.kg-status button{margin-left:1em;font-size:inherit;border-radius:8px;border:1px solid #fff;background:transparent;color:#fff;padding:.2em .8em}
.kg-old{background:#6b4a00;border-radius:10px;padding:1vh 1.2vw;font-size:clamp(14px,2vh,20px)}
.kg-old button{margin-left:1em;border:0;border-radius:8px;background:#fff;color:#2a1036;font-weight:700;padding:.3em .9em}
.kg-msg{margin:auto;text-align:center;font-size:clamp(20px,3.2vh,34px);line-height:1.5}
.kg-msg small{font-size:.6em;color:#c3b7cc}
.kg-modal{position:fixed;inset:0;background:rgba(10,4,15,.75);display:flex;align-items:center;justify-content:center;z-index:50}
.kg-dlg{background:#fff;color:#24182c;border-radius:20px;padding:3vh 3vw;width:min(92vw,720px);text-align:center}
.kg-dlg h2{margin:0 0 1.5vh;color:#5f227b;font-size:clamp(22px,3.2vh,34px)}
.kg-final{display:grid;grid-template-columns:1fr auto 1fr;gap:1.5vw;align-items:center;font-size:clamp(18px,2.8vh,30px);font-weight:700}
.kg-final b{font-size:clamp(40px,7vh,72px);color:#5f227b;font-variant-numeric:tabular-nums}
.kg-dlg-btns{display:flex;gap:2vw;margin-top:2vh}
.kg-dlg-btns button{flex:1;font-size:clamp(18px,2.6vh,28px);padding:1.6vh;border-radius:14px;border:1px solid #b1b3b4;background:#fff;cursor:pointer}
.kg-dlg-btns .kg-end{background:#5f227b;color:#fff;border:0}
@media (orientation:portrait){.kg-teams{grid-template-columns:1fr}.kg-vs{display:none}}
</style>
</head>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const toMin = t => { const m = /^(\d{1,2}):(\d{2})/.exec(t || ''); return m ? (+m[1]) * 60 + (+m[2]) : 0; };
const hhmm = m => { m = Math.round(m); const h = Math.floor(m / 60) % 24, mm = ((m % 60) + 60) % 60; return String(h).padStart(2, '0') + ':' + String(mm).padStart(2, '0'); };
const fmtClock = ms => { const s = Math.ceil(Math.max(0, ms) / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const sign = n => (n > 0 ? '+' : '') + n;
const num = v => (v === '' || v == null || isNaN(+v)) ? null : Math.max(0, Math.round(+v));

// Jeder-gegen-jeden nach Kreismethode (gibt Paare in Rundenreihenfolge)
function circlePairs(ids) {
  const a = ids.slice(); if (a.length < 2) return [];

  for (let r = 0; r < n - 1; r++) {

}
// Reihenfolge so, dass kein Team zwei Spiele direkt hintereinander hat (wenn möglich)

    if (++steps > 60000) return false;
    const cand = [];
    for (let i = 0; i < n; i++) if (!used[i]) {
      const [x, y] = pairs[i];
      if (last && (last.includes(x) || last.includes(y))) continue;
      cand.push(i);
    }
    cand.sort((p, q) => (c(pairs[p][0]) + c(pairs[p][1])) - (c(pairs[q][0]) + c(pairs[q][1])) || p - q);
    for (const i of cand) {
      used[i] = true; res.push(pairs[i]); cnt[pairs[i][0]] = c(pairs[i][0]) + 1; cnt[pairs[i][1]] = c(pairs[i][1]) + 1;
      if (dfs(pairs[i])) return true;
      used[i] = false; res.pop(); cnt[pairs[i][0]]--; cnt[pairs[i][1]]--;
    }

  }

}
// Allgemeine Verteilung auf Runden: keine Doppelbelegung, möglichst lange Pausen
function greedySlots(games, courts) {
  const last = {}, played = {}, rem = games.map((p, i) => ({ p, i })), slots = [];
  let s = 0;
  while (rem.length) {
    const sc = rem.map(o => {
      const ra = s - (last[o.p.h] ?? -9), rb = s - (last[o.p.a] ?? -9);
      return { o, rest: Math.min(ra, rb, 3), pl: (played[o.p.h] || 0) + (played[o.p.a] || 0) };
    }).sort((x, y) => y.rest - x.rest || x.pl - y.pl || x.o.i - y.o.i);
    const busy = new Set(), chosen = [];

      chosen.push(c.o); busy.add(c.o.p.h); busy.add(c.o.p.a);
    }
    chosen.forEach(o => {
      last[o.p.h] = last[o.p.a] = s;
      played[o.p.h] = (played[o.p.h] || 0) + 1; played[o.p.a] = (played[o.p.a] || 0) + 1;
      rem.splice(rem.indexOf(o), 1);

function koGames(st) {
  const mode = st.settings.mode, out = [];
  const R = (g, r) => ({ t: 'rank', group: g, rank: r });
  const mk = (label, home, away, place, deps) => { const g = { id: uid(), phase: 'ko', group: null, label, home, away, place, deps: deps || [] }; out.push(g); return g; };
  const pl = p => p === 1 ? 'Finale' : 'Spiel um Platz ' + p;
  if (mode === 'groups_ko' || mode === 'groups_cross') {
    const m = Math.min(groupIds(st, 'A').length, groupIds(st, 'B').length);
    if (mode === 'groups_ko' && m >= 2) {
      const sf1 = mk('Halbfinale 1', R('A', 1), R('B', 2), null);
      const sf2 = mk('Halbfinale 2', R('B', 1), R('A', 2), null);
      for (let k = m; k >= 3; k--) mk(pl(2 * k - 1), R('A', k), R('B', k), 2 * k - 1);
      mk('Spiel um Platz 3', { t: 'lose', game: sf1.id }, { t: 'lose', game: sf2.id }, 3, [sf1, sf2]);
      mk('Finale', { t: 'win', game: sf1.id }, { t: 'win', game: sf2.id }, 1, [sf1, sf2]);

function buildPlan(st) {

  const groups = groupsOf(st), single = groups.length === 1;
  const gp = {};
  groups.forEach(g => gp[g] = orderNoB2B(circlePairs(groupIds(st, g))).map(p => ({ h: p[0], a: p[1], group: g })));
  let groupSlots;
  if (groups.length === 2 && courts === 2 && gp.A.length === gp.B.length && gp.A.length)
    groupSlots = gp.A.map((x, i) => [x, gp.B[i]]);   // Gruppe A auf Feld 1, Gruppe B auf Feld 2
  else groupSlots = greedySlots(interleave(groups.map(g => gp[g])), courts);
  const games = [], slots = [];
  groupSlots.forEach((sl, si) => {
    slots.push({ phase: 'group' });
    sl.forEach((p, ci) => games.push({ id: uid(), phase: 'group', group: p.group, label: single ? 'Gruppenspiel' : 'Gruppe ' + p.group,
      slot: si, court: ci, home: { t: 'team', id: p.h }, away: { t: 'team', id: p.a }, sh: null, sa: null, done: false, winner: null, place: null }));
  });
  const ko = koGames(st), koSlots = [];
  ko.forEach(g => {

    const alone = g.place === 1 && set.finalAlone;
    if (alone) s = Math.max(s, koSlots.length);
    for (;;) {
      while (koSlots.length <= s) koSlots.push([]);
      const sl = koSlots[s];
      if (sl.length < courts && !sl.alone && !(alone && sl.length)) break;

    g._s = s; koSlots[s].push(g);

function timing(st) {

  if (set.autoDuration) {

    raw = n ? Math.floor((avail + co) / n - co) : 0;
    dg = dk = Math.max(1, raw);
    set.durGroup = set.durKo = dg;
  }
  let t = toMin(set.start);
  st.slots.forEach((s, i) => {
    if (i > 0) { t += co; if (s.phase === 'ko' && st.slots[i - 1].phase === 'group') t += mb; }
    s.start = t; s.dur = s.phase === 'ko' ? dk : dg; t += s.dur;

function preview(mode) {

  buildPlan(tmp);

/* ---------------- Tabellen & Auflösung ---------------- */
function table(st, group) {
  const ids = groupIds(st, group), set = st.settings, order = {};
  st.teams.forEach((t, i) => order[t.id] = i);
  const blank = id => ({ id, sp: 0, w: 0, d: 0, l: 0, pf: 0, pa: 0, pts: 0 });
  const rows = {}; ids.forEach(id => rows[id] = blank(id));
  const gs = st.games.filter(g => g.phase === 'group' && g.group === group && isFin(g));
  const tally = (R, g) => {
    const h = R[g.home.id], a = R[g.away.id]; if (!h || !a) return;
    h.sp++; a.sp++; h.pf += g.sh; h.pa += g.sa; a.pf += g.sa; a.pa += g.sh;
    if (g.sh > g.sa) { h.w++; a.l++; h.pts += +set.win; a.pts += +set.loss; }
    else if (g.sh < g.sa) { a.w++; h.l++; a.pts += +set.win; h.pts += +set.loss; }
    else { h.d++; a.d++; h.pts += +set.draw; a.pts += +set.draw; }
  };
  gs.forEach(g => tally(rows, g));
  const list = Object.values(rows).sort((x, y) => y.pts - x.pts), out = [];
  for (let i = 0; i < list.length;) {
    let j = i; while (j < list.length && list[j].pts === list[i].pts) j++;
    const block = list.slice(i, j);
    if (block.length > 1) {
      const inB = new Set(block.map(r => r.id)), mini = {};
      block.forEach(r => mini[r.id] = blank(r.id));
      gs.filter(g => inB.has(g.home.id) && inB.has(g.away.id)).forEach(g => tally(mini, g));
      block.sort((x, y) => (mini[y.id].pts - mini[x.id].pts)
        || ((mini[y.id].pf - mini[y.id].pa) - (mini[x.id].pf - mini[x.id].pa))
        || ((y.pf - y.pa) - (x.pf - x.pa)) || (y.pf - x.pf) || (order[x.id] - order[y.id]));
    }
    out.push(...block); i = j;
  }
  return out;
}
function groupDone(st, g) { const gs = st.games.filter(x => x.phase === 'group' && x.group === g); return gs.length > 0 && gs.every(isFin); }
function resolve(st, ref) {
  if (!ref) return null;
  if (ref.t === 'team') return ref.id;
  if (ref.t === 'rank') { if (!groupDone(st, ref.group)) return null; const r = table(st, ref.group)[ref.rank - 1]; return r ? r.id : null; }
  const g = st.games.find(x => x.id === ref.game); if (!g) return null;
  const w = winnerOf(st, g); if (!w) return null;
  if (ref.t === 'win') return w;
  const h = resolve(st, g.home), a = resolve(st, g.away); return w === h ? a : h;
}
function winnerOf(st, g) {
  if (!isFin(g)) return null;
  const h = resolve(st, g.home), a = resolve(st, g.away); if (!h || !a) return null;
  if (g.sh > g.sa) return h; if (g.sa > g.sh) return a;
  return g.winner === 'h' ? h : g.winner === 'a' ? a : null;
}
function refLabel(st, ref) {
  if (ref.t === 'team') return teamName(st, ref.id);
  if (ref.t === 'rank') return ref.rank + '. ' + (MODES[st.settings.mode].groups === 1 ? 'Tabelle' : 'Gruppe ' + ref.group);
  const g = st.games.find(x => x.id === ref.game);
  return (ref.t === 'win' ? 'Sieger ' : 'Verlierer ') + (g ? g.label.replace('Halbfinale ', 'HF ') : '?');
}
function side(st, ref) { const id = resolve(st, ref); return id ? { id, name: teamName(st, id), ph: false } : { id: null, name: refLabel(st, ref), ph: true }; }
function finalRanking(st) {
  if (!st.games.length || !st.games.every(isFin)) return null;
  const place = {};
  st.games.filter(g => g.place).forEach(g => {
    const w = winnerOf(st, g); if (!w) return;
    const h = resolve(st, g.home), a = resolve(st, g.away);
    place[w] = g.place; place[w === h ? a : h] = g.place + 1;
  });
  const rest = [];
  groupsOf(st).forEach(g => table(st, g).forEach((r, i) => { if (!(r.id in place)) rest.push({ id: r.id, i, r }); }));
  rest.sort((x, y) => x.i - y.i || y.r.pts - x.r.pts || (y.r.pf - y.r.pa) - (x.r.pf - x.r.pa));
  let next = Math.max(0, ...Object.values(place)) + 1;
  rest.forEach(x => place[x.id] = next++);
  return Object.entries(place).sort((a, b) => a[1] - b[1]).map(([id, p]) => ({ id, p }));
}

function horn(dur = 1.5) {
  const c = ac(); if (!c) return;
  const t = c.currentTime, v = +S.music.hornVol || 0.7;
  const g = c.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.03);

/* ---- Uhrsteuerung ---- */
function clockStart() {
  const c = S.clock;
  if (!S.slots.length || c.phase === 'running' || c.phase === 'ended' || c.phase === 'changeover') return;
  ac();
  const fresh = c.phase === 'idle';
  if (fresh && Music.playing) Music.stop();
  if (S.music.whistle && (fresh || S.music.whistleResume)) whistle();
  c.endsAt = Date.now() + c.remaining; c.phase = 'running';
  if (c.musicFired && c.remaining <= S.music.offset * 1000 && !Music.playing) Music.play();
  save(); updateClockUI();
}
function clockPause() { const c = S.clock; if (c.phase !== 'running') return; c.remaining = rem(); c.phase = 'paused'; if (Music.playing) Music.stop(true); save(); updateClockUI(); }
function clockReset() { S.clock = { phase: 'idle', remaining: slotDurMs(), endsAt: 0, musicFired: false }; if (Music.playing) Music.stop(); save(); updateClockUI(); }
function clockAdjust(d) {
  const c = S.clock;
  if (c.phase === 'running' || c.phase === 'changeover') c.endsAt = Math.max(Date.now(), c.endsAt + d);
  else if (c.phase === 'ended') { if (d > 0) { c.remaining = d; c.phase = 'paused'; } }
  else c.remaining = Math.max(0, c.remaining + d);
  if (c.phase !== 'changeover' && rem() > S.music.offset * 1000 && c.musicFired) { c.musicFired = false; if (Music.playing) Music.stop(); }
  save(); updateClockUI();
}
function setRound(i) {
  i = Math.max(0, Math.min(S.slots.length - 1, i));
  S.current = i; S.clock = { phase: 'idle', remaining: slotDurMs(i), endsAt: 0, musicFired: false };
  save(); renderResults();
}
function nextRound() {
  S.games.filter(g => g.slot === S.current && Number.isFinite(g.sh) && Number.isFinite(g.sa)).forEach(g => g.done = true);
  if (S.current < S.slots.length - 1) setRound(S.current + 1); else { save(); renderResults(); }
}
function tick() {
  const c = S.clock;
  if (c.phase === 'running') {
    const r = rem();
    if (!c.musicFired && S.music.source !== 'none' && r <= S.music.offset * 1000 && r > 0) { c.musicFired = true; Music.play(); save(); }
    if (r <= 0) {
      c.phase = 'ended'; c.remaining = 0;
      if (S.music.horn) horn();
      if (S.music.stopAtEnd && Music.playing) Music.stop();
      if (S.opts.autoChangeover && +S.settings.changeover > 0 && S.current < S.slots.length - 1) {
        c.phase = 'changeover'; c.endsAt = Date.now() + S.settings.changeover * 60000;
      }
      save();
    }
  } else if (c.phase === 'changeover' && rem() <= 0) {
    const auto = S.opts.autoNext;
    nextRound();
    if (auto) clockStart();
  }
  updateClockUI();
}

/* ---- Spielplan ---- */
function renderPlan() {
  const el = $('#tab-plan');
  if (!S.slots.length) { el.innerHTML = '<p>Noch kein Spielplan. <button class="link" data-tab="setup">Zur Einrichtung</button></p>'; return; }
  let html = '';
  S.slots.forEach((s, i) => {
    if (i > 0 && s.phase === 'ko' && S.slots[i - 1].phase === 'group' && +S.settings.midBreak > 0)
      html += `<tbody><tr class="brk"><td colspan="6">Pause ${S.settings.midBreak} min · danach Finalrunde</td></tr></tbody>`;
    const gs = S.games.filter(g => g.slot === i).sort((a, b) => a.court - b.court);
    html += `<tbody class="slot ${i === S.current ? 'cur' : ''} ${i < S.current ? 'past' : ''}">
      <tr class="sh"><td colspan="6"><b>Runde ${i + 1}</b> · ${hhmm(s.start)}–${hhmm(s.start + s.dur)} · ${s.phase === 'ko' ? 'Finalrunde' : 'Gruppenphase'}
      ${i === S.current ? '<span class="nowtag">aktuell</span>' : `<button class="link" data-act="setRound" data-i="${i}" style="margin-left:.6em">als aktuelle Runde setzen</button>`}</td></tr>
      ${gs.map(g => gameRow(g, 'p')).join('')}</tbody>`;
  });
  el.innerHTML = `${S.stale ? '<div class="banner">Du hast Mannschaften, Gruppen, Modus oder Spielfelder geändert. Der Plan unten ist noch der alte. <button class="btn sm" data-tab="setup">Zur Einrichtung</button></div>' : ''}
    <div class="row" style="margin:0 0 .8rem;justify-content:space-between">
      <span class="hint" style="margin:0">Ergebnis eintragen → Enter (oder Haken „Endstand“). Erst Spiele mit Endstand zählen in der Tabelle; Zwischenstände erscheinen live auf dem Zuschauer-Bildschirm.</span>
      <span class="row" style="margin:0"><select id="teamPrintSel" style="border:1px solid var(--line);border-radius:7px;padding:.35em .5em"><option value="all">Alle Mannschaften (je eine Seite)</option>${S.teams.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select><button class="btn sm" data-act="printTeams">Mannschaftsplan drucken</button>
      <button class="btn sm" data-act="clearResults">Alle Ergebnisse löschen</button></span>
    </div>
    <table class="plan">${html}</table>`;
}

/* ---- Druckansicht ---- */
function whistle(dur = 1.2) {
  const c = ac(); if (!c) return;
  const t = c.currentTime + 0.02, v = Math.min(1, (+S.music.hornVol || 0.7) * 1.2);
  const master = c.createGain();
  master.gain.setValueAtTime(0, t); master.gain.linearRampToValueAtTime(v, t + 0.025);
  master.gain.setValueAtTime(v, t + dur - 0.09); master.gain.linearRampToValueAtTime(0, t + dur);
  const comp = c.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 6;
  master.connect(comp); comp.connect(c.destination);
  // Triller der Erbse: schnelle Frequenz- und Lautstärkemodulation
  const lfo = c.createOscillator(); lfo.frequency.value = 34;
  const fm1 = c.createGain(); fm1.gain.value = 170; lfo.connect(fm1);
  const fm2 = c.createGain(); fm2.gain.value = 340; lfo.connect(fm2);
  const am = c.createGain(); am.gain.value = 0.62; const amd = c.createGain(); amd.gain.value = 0.38; lfo.connect(amd); amd.connect(am.gain);
  const o1 = c.createOscillator(); o1.type = 'sine'; o1.frequency.value = 2950; fm1.connect(o1.frequency); o1.connect(am);
  const o2 = c.createOscillator(); o2.type = 'triangle'; o2.frequency.value = 5900; fm2.connect(o2.frequency);
  const g2 = c.createGain(); g2.gain.value = 0.18; o2.connect(g2); g2.connect(am);
  am.connect(master);
  // Luftrauschen
  const len = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const n = c.createBufferSource(); n.buffer = buf;
  const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3000; bp.Q.value = 1.5;
  const ng = c.createGain(); ng.gain.value = 0.22; n.connect(bp); bp.connect(ng); ng.connect(master);
  [lfo, o1, o2, n].forEach(x => { x.start(t); x.stop(t + dur); });
}

/* ---- Mannschaftspläne ---- */
function teamGroupLabel(id) { return MODES[S.settings.mode].groups === 1 ? '' : 'Gruppe ' + ((S.teams.find(t => t.id === id) || {}).group || ''); }
// Kann diese Mannschaft über ref in das Spiel kommen? Liefert Bedingungstext oder null
function refCond(ref, id) {
  if (!ref) return null;
  if (ref.t === 'team') return ref.id === id ? '' : null;
  if (ref.t === 'rank') {
    if (!groupIds(S, ref.group).includes(id)) return null;
    if (groupDone(S, ref.group)) return resolve(S, ref) === id ? '' : null;
    return 'als ' + refLabel(S, ref);
  }
  const g = S.games.find(x => x.id === ref.game); if (!g) return null;
  if (isFin(g) && winnerOf(S, g)) return resolve(S, ref) === id ? '' : null;
  const inG = refCond(g.home, id) ?? refCond(g.away, id);
  if (inG == null) return null;
  return 'als ' + refLabel(S, ref);
}
function teamSheet(id) {
  const t = S.teams.find(x => x.id === id); if (!t) return '';
  const own = [], cond = [];
  S.games.forEach(g => {
    const ch = refCond(g.home, id), ca = refCond(g.away, id);
    if (ch === '' || ca === '') own.push({ g, home: ch === '' });
    else if (ch != null || ca != null) cond.push({ g, home: ch != null, c: ch != null ? ch : ca });
  });
  const sortG = (a, b) => a.g.slot - b.g.slot;
  own.sort(sortG); cond.sort(sortG);
  const row = (x, extra) => {
    const s = S.slots[x.g.slot], opp = side(S, x.home ? x.g.away : x.g.home);
    const res = isFin(x.g) ? (x.home ? x.g.sh + ' : ' + x.g.sa : x.g.sa + ' : ' + x.g.sh) : '____ : ____';
    return `<tr><td>${x.g.slot + 1}</td><td><b>${hhmm(s.start)}</b></td><td>${esc(courtName(x.g.court))}</td><td>${esc(x.g.label)}</td>${extra != null ? `<td>${esc(extra)}</td>` : ''}<td><b>${esc(opp.name)}</b></td><td class="res">${res}</td></tr>`;
  };
  const logos = (S.logos || []).length ? `<div class="plogos">${S.logos.map(l => `<img src="${l}" alt="">`).join('')}</div><div class="bar"></div>` : '';
  const ko = S.slots.find(s => s.phase === 'ko');
  const dur = S.slots[0] ? S.slots[0].dur : 0;
  return `<section class="tsheet">${logos}
    <h1>${esc(t.name)}</h1>
    <div class="sub">${esc(S.name)}${teamGroupLabel(id) ? ' · ' + teamGroupLabel(id) : ''} · Spieldauer ${dur} min${ko && ko.dur !== dur ? ' (Finalrunde ' + ko.dur + ' min)' : ''}</div>
    <h2>Deine Spiele</h2>
    <table><thead><tr><th>Rd.</th><th>Zeit</th><th>Feld</th><th>Spiel</th><th>Gegner</th><th>Ergebnis</th></tr></thead>
    <tbody>${own.map(x => row(x)).join('') || '<tr><td colspan="6">Keine Spiele</td></tr>'}</tbody></table>
    ${cond.length ? `<h2>Finalrunde – hängt von eurer Platzierung ab</h2>
    <table><thead><tr><th>Rd.</th><th>Zeit</th><th>Feld</th><th>Spiel</th><th>Ihr spielt …</th><th>Gegner</th><th>Ergebnis</th></tr></thead>
    <tbody>${cond.map(x => row(x, x.c)).join('')}</tbody></table>
    ${ko ? `<div class="note">Die Finalrunde beginnt um ${hhmm(ko.start)} Uhr. Welche dieser Spiele ihr bestreitet, ergibt sich aus eurer Platzierung in der Gruppe.</div>` : ''}` : ''}
    <div class="note">Bitte rechtzeitig vor jedem Spiel am Feld sein. Aktuelle Ergebnisse und Tabellen stehen auf dem Bildschirm in der Halle.</div>
  </section>`;
}
function printTeams(which) {

function printPlan() {
  if (!S.slots.length) { toast('Noch kein Spielplan.'); return; }

function shrinkImage(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, 400 / img.height, 900 / img.width), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/png'));
    }; img.onerror = () => res(null); img.src = r.result; };
    r.onerror = () => res(null); r.readAsDataURL(file);
  });
}

    const t = e.target;

      e.preventDefault();
      const g = S.games.find(x => x.id === t.dataset.g); if (!g) return;
      g[t.dataset.side] = num(t.value);
      if (t.dataset.side === 'sh') { const o = document.getElementById(t.id.replace('-sh-', '-sa-')); if (o) { o.focus(); o.select(); } save(); renderResultsSoon(); return; }
      if (g.sh != null && g.sa != null) g.done = true;
      save(); t.blur(); renderResults(); return;
    }
    if (e.code === 'Space' && !/INPUT|SELECT|TEXTAREA|BUTTON/.test(t.tagName)) { e.preventDefault(); ac(); S.clock.phase === 'running' ? clockPause() : clockStart(); }
  });
  window.addEventListener('message', e => { if (e.data && e.data.bb === 'hello') { displayWin = e.source; save(); } });
  if (bc) bc.addEventListener('message', e => { if (e.data === 'hello') save(); });
  setInterval(tick, 100);
}

/* ============================================================
   DIGITALER SPIELBERICHT – Kampfgericht auf iPads
   Übertragung über einen ntfy-Server (Standard: ntfy.sh, kostenlos, ohne Konto).
   Kanal "<kanal>-s": Verwaltung → iPads (aktuelles Spiel je Feld, Uhr, Bestätigungen)
   Kanal "<kanal>-r": iPads → Verwaltung (Zwischenstände, Endergebnisse)
   ============================================================ */
function kgDefaults() { return { enabled: false, channel: '', server: 'https://ntfy.sh', url: '', auto: false, live: true, seq: 0, handled: [], pending: [] }; }
function newChannel() {
  const a = 'abcdefghijkmnpqrstuvwxyz23456789'; let s = 'bbt';
  crypto.getRandomValues(new Uint8Array(20)).forEach(x => s += a[x % a.length]);
  return s;
}
const kgBase = srv => String(srv || 'https://ntfy.sh').trim().replace(/\/+$/, '');
function relayPub(srv, topic, obj) {
  return fetch(`${kgBase(srv)}/${topic}`, { method: 'POST', body: JSON.stringify(obj) })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r; });
}
function relaySub(srv, topic, onMsg, onStatus) {
  const seen = new Set();
  const es = new EventSource(`${kgBase(srv)}/${topic}/sse?since=all`);
  es.onopen = () => onStatus && onStatus(true);
  es.onerror = () => onStatus && onStatus(es.readyState === 1);
  es.onmessage = e => {
    let o; try { o = JSON.parse(e.data); } catch (x) { return; }
    if (o.event && o.event !== 'message') return;
    if (o.id) { if (seen.has(o.id)) return; seen.add(o.id); }
    let m; try { m = JSON.parse(o.message); } catch (x) { return; }
    onMsg(m, o);
  };
  return es;
}
function qrSvg(text, cell) {
  try { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag(cell || 6, 2); }
  catch (e) { return '<p class="bad">QR-Code konnte nicht erzeugt werden.</p>'; }
}

/* ---------------- Verwaltung ---------------- */
const KGA = { es: null, ok: false, last: '', timer: null, force: false, lastMsg: 0, err: false };
function kgUrlBase() {
  const u = (S.kg.url || '').trim();
  if (u) return u.split('#')[0];
  if (/^https?:$/.test(location.protocol)) return location.href.split('#')[0];
  return '';
}
function kgLink(f) {
  const b = kgUrlBase(); if (!b || !S.kg.channel) return '';
  let h = `#kg=${S.kg.channel}&f=${f}`;
  if (kgBase(S.kg.server) !== 'https://ntfy.sh') h += '&s=' + encodeURIComponent(kgBase(S.kg.server));
  return b + h;
}
function kgConnect() {
  if (KGA.es) { KGA.es.close(); KGA.es = null; }
  KGA.ok = false; KGA.last = '';
  if (!S.kg.enabled || !S.kg.channel) { kgStatusUI(); return; }
  KGA.es = relaySub(S.kg.server, S.kg.channel + '-r', kgOnMsg, ok => { KGA.ok = ok; if (ok) KGA.err = false; kgStatusUI(); });
  kgPublish(true);
}
function kgPayload() {
  const courts = [], n = Math.max(1, +S.settings.courts || 1), s = S.slots[S.current], c = S.clock;
  for (let f = 0; f < n; f++) {
    const g = S.games.find(x => x.slot === S.current && x.court === f);
    let game = null;
    if (g) {
      const h = side(S, g.home), a = side(S, g.away), fin = isFin(g);
      game = { gid: g.id, label: g.label, home: h.name, away: a.name, ph: h.ph || a.ph, done: fin, sh: fin ? g.sh : null, sa: fin ? g.sa : null };
    }
    courts.push({ f, name: courtName(f), game });
  }
  return { t: 'state', name: S.name, round: S.current + 1, rounds: S.slots.length, start: s ? hhmm(s.start) : '', dur: s ? s.dur : 0,
    courts, clock: { phase: c.phase, endsAt: c.endsAt, remaining: c.remaining } };
}
function kgPublish(force) {
  if (!S.kg || !S.kg.enabled || !S.kg.channel || !S.slots.length) return;
  KGA.force = KGA.force || !!force;
  clearTimeout(KGA.timer);
  KGA.timer = setTimeout(() => {
    const p = kgPayload(), key = JSON.stringify(p), f = KGA.force;
    KGA.force = false;
    if (!f && key === KGA.last) return;
    KGA.last = key; p.seq = ++S.kg.seq; p.sentAt = Date.now();
    try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
    relayPub(S.kg.server, S.kg.channel + '-s', p)
      .then(() => { KGA.err = false; kgStatusUI(); })
      .catch(() => { KGA.last = ''; KGA.err = true; kgStatusUI(); setTimeout(() => kgPublish(), 8000); });
  }, force ? 250 : 1200);
}
function kgOnMsg(m) {
  KGA.lastMsg = Date.now();
  if (m.t === 'hello') { kgPublish(true); return; }
  if (m.t !== 'report') return;
  const g = S.games.find(x => x.id === m.gid);
  if (!m.final) {   // Zwischenstand
    if (!g || !S.kg.live || g.done || Date.now() - (m.ts || 0) > 120000) return;
    if (g.sh === m.sh && g.sa === m.sa) return;
    g.sh = num(m.sh); g.sa = num(m.sa); save(); renderResultsSoon(); return;
  }
  if (S.kg.handled.includes(m.rid)) return;
  S.kg.handled.push(m.rid); if (S.kg.handled.length > 400) S.kg.handled.splice(0, 100);
  if (!g) { save(); kgAck(m.rid, false, 'Dieses Spiel gibt es im aktuellen Spielplan nicht mehr.'); return; }
  m.sh = num(m.sh); m.sa = num(m.sa);
  S.kg.pending = S.kg.pending.filter(p => p.gid !== m.gid);
  if (S.kg.auto) { kgApply(m); toast(`${courtName(g.court)}: Ergebnis übernommen.`); return; }
  S.kg.pending.push(m); save(); renderResults(); renderKg();
  toast(`${courtName(g.court)} meldet ein Ergebnis – bitte prüfen.`); beep(1);
}
function kgApply(m) {
  const g = S.games.find(x => x.id === m.gid);
  S.kg.pending = S.kg.pending.filter(p => p.rid !== m.rid);
  if (g) { g.sh = m.sh; g.sa = m.sa; g.done = true; }
  save(); renderResults(); renderKg(); kgAck(m.rid, true);
}
function kgReject(rid) {
  S.kg.pending = S.kg.pending.filter(p => p.rid !== rid);
  save(); renderResults(); renderKg(); kgAck(rid, false, 'Die Turnierleitung hat das Ergebnis nicht übernommen. Bitte prüfen und erneut senden.');
}
function kgAck(rid, ok, msg) { relayPub(S.kg.server, S.kg.channel + '-s', { t: 'ack', rid, ok, msg: msg || '' }).catch(() => {}); }
function kgPendingHtml() {
  if (!S.kg || !S.kg.pending.length) return '';
  return `<div class="kgp-list">${S.kg.pending.map(p => {
    const g = S.games.find(x => x.id === p.gid);
    const h = g ? side(S, g.home).name : p.home, a = g ? side(S, g.away).name : p.away;
    const where = g ? `${courtName(g.court)}${g.slot !== S.current ? ' · Runde ' + (g.slot + 1) : ''}` : 'Feld ?';
    return `<div class="kgp"><span class="kgp-tag">Spielbericht ${esc(where)}</span><span>${esc(h)} <b>${p.sh} : ${p.sa}</b> ${esc(a)}</span>
      <button data-act="kgOk" data-rid="${esc(p.rid)}">Übernehmen</button><button data-act="kgNo" data-rid="${esc(p.rid)}" class="no">Ablehnen</button></div>`;
  }).join('')}</div>`;
}
function kgStatusText() {
  if (!S.kg.enabled) return { cls: '', txt: 'aus' };
  if (!S.kg.channel) return { cls: 'bad', txt: 'kein Kanal' };
  if (KGA.err) return { cls: 'bad', txt: 'Senden fehlgeschlagen – Internet prüfen' };

function kgStatusUI() {

const K = { ch: '', f: 0, srv: 'https://ntfy.sh', state: null, ok: false, es: null, data: null, liveT: null, lastLive: 0, flushing: false, confirm: null, helloAt: 0, wake: null };

  document.body.className = 'kgbody';
  document.title = 'Kampfgericht ' + (K.f + 1);
  if (!K.ch) { $('#app').innerHTML = '<div class="kg-msg">Ungültiger Link – bitte den QR-Code erneut scannen.</div>'; return; }
  K.es = relaySub(K.srv, K.ch + '-s', kgOnState, ok => {
    K.ok = ok; kgRenderStatus();
    if (ok && Date.now() - K.helloAt > 20000) { K.helloAt = Date.now(); relayPub(K.srv, K.ch + '-r', { t: 'hello', f: K.f }).catch(() => {}); }
  });
  document.addEventListener('click', kgClick);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') kgWake(); });
  setInterval(kgFlush, 5000);
  setInterval(kgTick, 250);
  kgRender();
}
function kgWake() { try { if ('wakeLock' in navigator && !K.wake) navigator.wakeLock.request('screen').then(w => { K.wake = w; w.addEventListener('release', () => K.wake = null); }).catch(() => {}); } catch (e) {} }
function kgOnState(m) {
  if (m.t === 'state') {
    if (!K.state || (m.sentAt || 0) >= (K.state.sentAt || 0)) { K.state = m; kgRender(); }
  } else if (m.t === 'ack') {
    let hit = false;
    Object.values(K.data.games).forEach(r => { if (r.sent === m.rid) { r.status = m.ok ? 'ok' : 'rejected'; r.msg = m.msg || ''; hit = true; } });
    if (hit) { kgSaveLocal(); kgRender(); }
  }
}
function kgAdd(k, n) {
  const g = kgGame(); if (!g) return;
  const r = kgRec(g.gid); if (kgLocked(r) || g.done) return;
  Object.assign(r, { home: g.home, away: g.away, label: g.label });
  if (r.status === 'rejected') { r.status = ''; r.msg = ''; }
  const v = Math.max(0, r[k] + n); if (v === r[k]) return;
  r.hist.push([k, v - r[k]]); r[k] = v;
  kgSaveLocal(); kgRender(); kgLiveSoon(g.gid);
}
function kgUndo() {
  const g = kgGame(); if (!g) return;
  const r = kgRec(g.gid); if (kgLocked(r)) return;
  const h = r.hist.pop(); if (!h) return;
  r[h[0]] -= h[1]; kgSaveLocal(); kgRender(); kgLiveSoon(g.gid);
}
function kgLiveSoon(gid) {
  clearTimeout(K.liveT);
  const wait = Math.max(1200, 11000 - (Date.now() - K.lastLive));
  K.liveT = setTimeout(() => {
    const r = K.data.games[gid]; if (!r || kgLocked(r)) return;
    K.lastLive = Date.now();
    relayPub(K.srv, K.ch + '-r', { t: 'report', final: false, gid, sh: r.sh, sa: r.sa, f: K.f, ts: Date.now() }).catch(() => {});
  }, wait);
}
function kgSend(gid) {
  const r = K.data.games[gid]; if (!r) return;
  clearTimeout(K.liveT);
  const rid = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  r.sent = rid; r.status = 'sent'; r.msg = '';
  K.data.outbox = (K.data.outbox || []).filter(m => m.gid !== gid);
  K.data.outbox.push({ t: 'report', final: true, rid, gid, sh: r.sh, sa: r.sa, home: r.home, away: r.away, f: K.f, ts: Date.now() });
  kgSaveLocal(); kgRender(); kgFlush();
}
function kgFlush() {
  if (K.flushing || !K.data.outbox || !K.data.outbox.length) return;
  K.flushing = true;
  relayPub(K.srv, K.ch + '-r', K.data.outbox[0])
    .then(() => { K.data.outbox.shift(); kgSaveLocal(); K.flushing = false; kgRender(); kgFlush(); })
    .catch(() => { K.flushing = false; kgRenderStatus(); });
}
function kgCorrect(gid) {
  const r = K.data.games[gid]; if (!r) return;
  r.status = ''; r.sent = null; r.msg = '';
  K.data.outbox = (K.data.outbox || []).filter(m => m.gid !== gid);
  kgSaveLocal(); kgRender();
}
function kgClick(e) {
  kgWake(); ac();
  const b = e.target.closest('[data-k]'); if (!b) return;
  const a = b.dataset.k, g = kgGame();
  if (a === 'add') kgAdd(b.dataset.s, +b.dataset.n);
  else if (a === 'undo') kgUndo();
  else if (a === 'end' && g) { K.confirm = g.gid; kgRender(); }
  else if (a === 'cancel') { K.confirm = null; kgRender(); }
  else if (a === 'send') { const gid = K.confirm; K.confirm = null; kgSend(gid); }
  else if (a === 'correct' && g) kgCorrect(g.gid);
  else if (a === 'sendOld') kgSend(b.dataset.gid);
}
function kgTick() {
  const el = $('#kgClock'); if (!el || !K.state || !K.state.clock) return;
  const c = K.state.clock;
  const r = (c.phase === 'running' || c.phase === 'changeover') ? Math.max(0, c.endsAt - Date.now()) : c.remaining;
  el.textContent = fmtClock(r);
  el.className = 'kg-clock' + (c.phase === 'changeover' ? ' co' : c.phase === 'ended' ? ' ended' : (c.phase === 'running' && r <= 60000) ? ' last' : '');
  const l = $('#kgClockLab');
  if (l) l.textContent = { idle: 'bereit', running: 'läuft', paused: 'angehalten', ended: 'Spielende', changeover: 'Wechsel' }[c.phase] || '';
}
function kgRenderStatus() {
  const el = $('#kgConn'); if (!el) return;
  const q = (K.data.outbox || []).length;
  el.innerHTML = `<span class="kgdot ${K.ok ? 'ok' : 'bad'}"></span>${K.ok ? 'verbunden' : 'keine Verbindung'}${q ? ` · ${q} Meldung${q > 1 ? 'en' : ''} wartet auf Versand` : ''}`;
}
function kgRender() {
  const app = $('#app'), st = K.state, g = kgGame();
  const head = `<header class="kg-h"><div><div class="kg-t">${esc(st ? st.name : 'Kampfgericht')}</div>
      <div class="kg-sub">Kampfgericht <b>${esc(kgCourtName())}</b>${st ? ` · Runde ${st.round} von ${st.rounds}` : ''}</div>
      <div class="kg-conn" id="kgConn"></div></div>
    <div class="kg-cbox"><div class="kg-clock" id="kgClock">–:––</div><div class="kg-clab" id="kgClockLab"></div></div></header>`;
  // nicht gesendete Ergebnisse früherer Spiele
  const old = Object.entries(K.data.games).filter(([gid, r]) => (!g || gid !== g.gid) && !r.sent && (r.sh || r.sa));
  const oldHtml = old.map(([gid, r]) => `<div class="kg-old">Nicht gesendet: ${esc(r.home)} <b>${r.sh} : ${r.sa}</b> ${esc(r.away)}
      <button data-k="sendOld" data-gid="${esc(gid)}">Jetzt senden</button></div>`).join('');
  let body;
  if (!st) body = '<div class="kg-msg">Verbinde mit der Turnierleitung …<br><small>Internetverbindung des iPads prüfen.</small></div>';
  else if (!g) body = `<div class="kg-msg">Gerade kein Spiel auf ${esc(kgCourtName())}.<br><small>Das nächste Spiel erscheint automatisch.</small></div>`;
  else {
    const r = kgRec(g.gid), lock = kgLocked(r) || g.done;
    const team = (s, name) => `<div class="kg-team ${lock ? 'lock' : ''}">
        <div class="kg-name">${esc(name)}</div>
        <div class="kg-score">${s === 'h' ? (g.done && !r.sent ? g.sh : r.sh) : (g.done && !r.sent ? g.sa : r.sa)}</div>
        <div class="kg-btns"><button data-k="add" data-s="${s === 'h' ? 'sh' : 'sa'}" data-n="1" ${lock ? 'disabled' : ''}>+1</button><button data-k="add" data-s="${s === 'h' ? 'sh' : 'sa'}" data-n="2" ${lock ? 'disabled' : ''}>+2</button><button data-k="add" data-s="${s === 'h' ? 'sh' : 'sa'}" data-n="3" ${lock ? 'disabled' : ''}>+3</button></div>
        <button class="kg-minus" data-k="add" data-s="${s === 'h' ? 'sh' : 'sa'}" data-n="-1" ${lock ? 'disabled' : ''}>−1</button></div>`;
    let status = '';
    if (r.status === 'sent') status = `<div class="kg-status wait">Ergebnis gesendet – wartet auf die Turnierleitung … <button data-k="correct">Korrigieren</button></div>`;
    else if (r.status === 'ok') status = '<div class="kg-status ok">✓ Von der Turnierleitung übernommen. Das nächste Spiel erscheint automatisch.</div>';
    else if (r.status === 'rejected') status = `<div class="kg-status bad">${esc(r.msg || 'Nicht übernommen – bitte prüfen.')}</div>`;
    else if (g.done) status = `<div class="kg-status ok">Die Turnierleitung hat den Endstand ${g.sh} : ${g.sa} eingetragen.</div>`;
    body = `<div class="kg-label">${esc(g.label)}${st.start ? ` · ${esc(st.start)} Uhr` : ''}${g.ph ? ' · Mannschaften stehen noch nicht fest' : ''}</div>
      <div class="kg-teams">${team('h', g.home)}<div class="kg-vs">:</div>${team('a', g.away)}</div>
      ${status}
      <div class="kg-foot"><button class="kg-undo" data-k="undo" ${lock || !r.hist.length ? 'disabled' : ''}>↶ Rückgängig</button>
        <button class="kg-end" data-k="end" ${lock ? 'disabled' : ''}>Spiel beenden &amp; Ergebnis senden</button></div>`;
    if (K.confirm === g.gid) body += `<div class="kg-modal"><div class="kg-dlg"><h2>Endstand bestätigen</h2>
        <div class="kg-final"><span>${esc(g.home)}</span><b>${r.sh} : ${r.sa}</b><span>${esc(g.away)}</span></div>
        <p>Stimmt das Ergebnis? Es wird an die Turnierleitung gesendet.</p>
        <div class="kg-dlg-btns"><button data-k="cancel">Zurück</button><button class="kg-end" data-k="send">Ja, senden</button></div></div></div>`;
  }
  app.innerHTML = `<div class="kg">${head}${oldHtml}<main class="kg-main">${body}</main></div>`;
  kgRenderStatus(); kgTick();
}

/* ---------------- Start ---------------- */
if (IS_KG) { kgInit(); }
else if (IS_DISPLAY) { bindDisplay(); renderDisplay(); }
else {
  if (S.slots.length) timing(S);
  if (S.clock.phase === 'idle' && S.slots.length) S.clock.remaining = slotDurMs();
  adminSkeleton(); bindAdmin(); renderAll(); save(); kgConnect();
}
</script>
</body>
</html>
